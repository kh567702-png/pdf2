name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pyside6 pypdf pyinstaller
      - name: Build
        run: pyinstaller --onefile --windowed --name PDFPrintCalc pdf_print_calc.py
      - uses: actions/upload-artifact@v4
        with:
          name: PDFPrintCalc
          path: dist/PDFPrintCalc.exe
